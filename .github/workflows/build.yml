name: Build and Deploy Blog

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.config.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Manual runs ("Run workflow" button) always go through, no matter what
      # deploy.auto_sync in config.yml says. Scheduled/push runs are skipped
      # when auto_sync is false.
      - name: Check deploy.auto_sync in config.yml
        id: config
        run: |
          AUTO_SYNC=$(python -c "import json, yaml; c = yaml.safe_load(open('config.yml')); print(json.dumps(bool((c.get('deploy') or {}).get('auto_sync', True))))")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$AUTO_SYNC" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

      # Creates/enables the Pages site (build_type: workflow) on first run —
      # no manual Settings > Pages step needed.
      - name: Setup Pages
        if: steps.config.outputs.should_build == 'true'
        uses: actions/configure-pages@v6

      - name: Build site from Notion
        if: steps.config.outputs.should_build == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python build.py

      - name: Upload Pages artifact
        if: steps.config.outputs.should_build == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
