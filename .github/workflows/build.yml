name: Build and Deploy Blog

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check deploy.auto_sync in config.yml
        id: config
        run: |
          AUTO_SYNC=$(python -c "import json, yaml; c = yaml.safe_load(open('config.yml')); print(json.dumps(bool((c.get('deploy') or {}).get('auto_sync', True))))")
          echo "auto_sync=$AUTO_SYNC" >> "$GITHUB_OUTPUT"

      # Manual runs ("Run workflow" button) always go through, no matter what
      # deploy.auto_sync in config.yml says. Scheduled/push runs are skipped
      # when auto_sync is false.
      - name: Build site from Notion
        if: github.event_name == 'workflow_dispatch' || steps.config.outputs.auto_sync == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python build.py

      - name: Commit and push if changed
        if: github.event_name == 'workflow_dispatch' || steps.config.outputs.auto_sync == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "chore: sync blog from Notion"
          git push
