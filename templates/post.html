{% extends "base.html" %}
{% block title %}{{ title }} · {{ site_title }}{% endblock %}
{% block content %}
<article>
  <h1 class="mb-2">{{ title }}</h1>
  <div class="text-body-secondary small mb-4 post-item-meta">
    <span><i class="bi bi-calendar3"></i> {{ date }}</span>
    {% for tag in tags %}<a class="badge text-bg-light text-body-secondary text-decoration-none" href="{{ base_path }}/tags/{{ tag.slug }}/"><i class="bi bi-tag-fill"></i> {{ tag.name }}</a>{% endfor %}
  </div>
  <div class="post-content">
    {{ content | safe }}
  </div>
  <a class="d-inline-block mt-5 text-decoration-none text-body-secondary" href="{{ base_path }}/">&larr; All posts</a>
</article>
{% endblock %}
